name: Aria Prop E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 08:00 Argentina (UTC-3) -> 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      E2E_WEBHOOK_URL: ${{ secrets.E2E_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 14

  production-smoke:
    name: Production Availability
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check production
        env:
          BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
        run: |
          set -e
          echo "Checking $BASE_URL"
          STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/response.html \
            --write-out "%{http_code}" \
            --location \
            --max-time 30 \
            "$BASE_URL/login")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Production is unavailable."
            exit 1
          fi
          echo "Production is healthy."
